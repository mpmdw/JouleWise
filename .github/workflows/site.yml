# Site observatory — RETIRED from all automatic processes (Ed directive
# 2026-08-12, D-136; extends D-101 addendum II and D-135). The site lane
# consumed session tokens chasing capsule-size failures for a repetitive
# status doc; it now runs ONLY on manual dispatch, never on push or
# pull_request, and its results never gate anything or prompt any
# session work. Project ci contains zero site machinery.
name: site

on:
  workflow_dispatch:

jobs:
  site-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site_capsule/package-lock.json
      - name: Install pinned publication build tools (network, no credentials)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix site_capsule ci --ignore-scripts --no-audit --no-fund
      - name: Site-lane tests (parsers + capsule pack, incl. live-content)
        env:
          JOULEWISE_SITE_CONTENT_TESTS: "1"
        run: python -m unittest -v tests.test_build_site_parsers tests.test_pack_capsule
      - name: Exercise non-secret publication chain in a clean temporary snapshot
        env:
          JOULEWISE_MARKED_BIN: ${{ github.workspace }}/node_modules/.bin/marked
          JOULEWISE_LAKEBED_BIN: ${{ github.workspace }}/site_capsule/node_modules/.bin/lakebed
        run: python scripts/release_check.py --dry-run
