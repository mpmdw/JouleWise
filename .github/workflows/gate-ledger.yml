name: gate-ledger

# ==================================================================
# REQUIRED GATE-LEDGER CHECK on main since 2026-09-24, made required in
# Ed's interactive session (T26 cold gate item 2, D-170; interactive
# record 02a24110 §7).
# Every fresh PR is red by construction because the template seeds an
# unresolved Tier choice, TODO Impact lines and NOT-RUN rows; that
# deliberate nudge keeps an incomplete ledger visible.
#
# Read this before touching anything below. This job validates the
# "## Gate ledger" section that .github/pull_request_template.md seeds
# into every PR body: D-118 as thinned on 2026-09-29 (summary in
# docs/process_prune_2026-09-29.md). Five rows, each key present once,
# plus the six Impact lines (i)-(vi), each answered Yes or No. Full tier
# (also the missing-Tier fallback) needs RUN evidence in rows 1, 2, 3 and
# 5; row 4 (cold final pass) may read N/A only when every Impact line is
# No. Light tier needs rows 2 and 3 (row 2 may be N/A (docs only)), N/A
# (light tier) in rows 1, 4 and 5, and no Impact line answered Yes. Every
# `RUN <path>` must resolve at the PR head under scripts/gen_state.py's
# pointer rules, every `RUN <sha>` a commit the checkout knows, and row 3
# names the PR's final head sha. It targets the MISTAKE class (a
# forgotten row, a light tier that changes a number); a deliberately
# pasted block is out of the threat model (D-161).
# The PR head sha is checked out explicitly because the merge ref is not the PR head.
#
# It lives in its own workflow, not ci.yml, because it must also fire on
# `edited` (the ledger is filled by editing the PR body after the review
# rounds) and widening ci.yml's untyped `pull_request` trigger would
# re-run the whole ~17-minute matrix on every body edit.
#
# Made a required status check on main on 2026-09-24 in Ed's interactive
# session (record 02a24110 §7); the
# D-072 self-merge condition also requires it green on the final head.
# ==================================================================

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

concurrency:
  group: gate-ledger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `RUN <sha>` rows naming earlier commits of the
          # branch resolve with `git cat-file -e <sha>^{commit}`.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate the gate ledger in the PR body
        # The body is passed through the environment, never interpolated
        # into the script line (a body is attacker-shaped text).
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check_gate_ledger.py \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --head-sha "$PR_HEAD_SHA" \
            --repo-root .
