name: d117-production-proof

# ADVISORY pending D-130 closure (cold-gate ruling 2026-08-11, PR #122):
# manual dispatch only for the first matrix-split proof. Its first hosted green
# is the required second independent decisive execution; D-130 closure then
# flips this workflow back to automatic push/pull_request triggering.
# Any leg contradiction is an automatic stop signal and requires a cold gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d117-production-proof-plan:
    name: d117-production-proof-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # This cheap certification is the proof that the registry partition is
      # exhaustive and disjoint. The Actions matrix is then emitted from that
      # same registry, so workflow YAML cannot silently drop a decisive leg.
      - name: Certify and emit decisive-leg matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_mint_floor_artifact_generalized.V2PinsetAndMintTests.test_d117_production_proof_registry_partition_is_exhaustive_and_disjoint
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from tests.test_mint_floor_artifact_generalized import (
              d117_production_proof_matrix,
          )

          print(
              "matrix="
              + json.dumps(
                  d117_production_proof_matrix(),
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

  d117-production-proof:
    name: >-
      d117-production-proof (${{ matrix.partition }},
      est ${{ matrix.estimated_minutes }}m)
    needs: d117-production-proof-plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.d117-production-proof-plan.outputs.matrix) }}
    steps:
      # Per-job budget (all 22 registry rows): 235 min estimated, leaving
      # 125 min against the 360-min cap. Basis: the representative local split
      # measured BUILD=35.53 min; the prior monolith reached its attack matrix
      # at 105.22 min. Static stage analysis shows that the two non-attack
      # stages each make one full mint pass over the same fixture, giving
      # (105.22 - 35.53) / 2 = 34.85 min per pass. One build + one full leg is
      # therefore estimated at 70.38 local min; applying the stated worst scale
      # 11 h / 3 h 35 m = 3.07 gives 216.1 min, with 18.9 min added for
      # checkout/cache/hydration and rounding. No job combines two full passes.
      # 1. Source-only checkout; the content directories are release payload.
      - name: 1 - Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read governed transport descriptor
        id: transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from scripts.hydrate_d117_fixture import load_descriptor

          descriptor = load_descriptor(
              Path("tests/fixtures/d117_v2_production/transport_descriptor.json")
          )
          for key in ("archive_sha256", "asset_name", "release_tag"):
              print(f"{key}={descriptor[key]}")
          PY

      # 2. The cache key is exactly the governed archive digest. There is no
      # restore prefix and the expanded fixture is never cached.
      - name: 2 - Restore digest-exact compressed archive cache
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/${{ steps.transport.outputs.asset_name }}
          key: ${{ steps.transport.outputs.archive_sha256 }}

      # 3. The repository is public, so this download is deliberately
      # unauthenticated. A miss or network failure is a hard curl failure.
      - name: 3 - Download release asset on cache miss
        if: steps.archive-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ASSET_NAME: ${{ steps.transport.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.transport.outputs.release_tag }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}" \
            --output "$RUNNER_TEMP/$ASSET_NAME"

      # 4. A corrupt cache is not replaced opportunistically: it fails here.
      - name: 4 - Verify archive SHA before extraction
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.transport.outputs.archive_sha256 }}
          ASSET_NAME: ${{ steps.transport.outputs.asset_name }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/$ASSET_NAME"
          python - "$RUNNER_TEMP/$ASSET_NAME" "$ARCHIVE_SHA256" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          digest = hashlib.sha256()
          with path.open("rb") as handle:
              while chunk := handle.read(1024 * 1024):
                  digest.update(chunk)
          observed = digest.hexdigest()
          if observed != sys.argv[2]:
              raise SystemExit(
                  f"archive SHA mismatch: expected {sys.argv[2]}, observed {observed}"
              )
          print(f"archive_sha256={observed}")
          PY

      - name: Save verified compressed archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/${{ steps.transport.outputs.asset_name }}
          key: ${{ steps.transport.outputs.archive_sha256 }}

      # 5. The governed hydrator rejects every unsafe type/path and extracts
      # only beneath RUNNER_TEMP.
      - name: 5 - Safely hydrate fixture under runner temp
        shell: bash
        env:
          ASSET_NAME: ${{ steps.transport.outputs.asset_name }}
        run: |
          set -euo pipefail
          command -v zstd
          python scripts/hydrate_d117_fixture.py \
            --archive "$RUNNER_TEMP/$ASSET_NAME" \
            --descriptor tests/fixtures/d117_v2_production/transport_descriptor.json \
            --census tests/fixtures/d117_v2_production/custody_store/manifest.json \
            --destination "$RUNNER_TEMP/d117-v2-custody-store"

      # 6. Repeat the byte comparison explicitly at the workflow boundary.
      - name: 6 - Verify hydrated census byte equality
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            tests/fixtures/d117_v2_production/custody_store/manifest.json \
            "$RUNNER_TEMP/d117-v2-custody-store/manifest.json"

      # 7. The issued ledger, not the census or descriptor, supplies the
      # identities. The production loader must authenticate all 190 members.
      - name: 7 - Authenticate issued ledger and full custody census
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/d117-v2-custody-store" <<'PY'
          import json
          from pathlib import Path
          import sys

          from joulewise.authentication_io import V2AuthenticationReadSession
          from joulewise.calibration_ledger import load_calibration_ledger_snapshot

          fixture = Path("tests/fixtures/d117_v2_production")
          store = Path(sys.argv[1])
          with V2AuthenticationReadSession():
              snapshot = load_calibration_ledger_snapshot(
                  fixture / "issued" / "calibration_observation_ledger.jsonl",
                  fixture / "issued" / "calibration_ledger_head.json",
                  require_committed_pin=False,
                  calibration_custody_store=store,
              )
          if not snapshot.valid:
              raise SystemExit(f"issued ledger/store refused: {snapshot.refusal_reasons}")
          if len(snapshot.receipts) != 76 or len(snapshot.observations) != 38:
              raise SystemExit("issued ledger census is not 76 receipts / 38 observations")
          census = json.loads((store / "manifest.json").read_bytes())
          governed = sum(len(row["artifact_sha256"]) for row in census["contents"])
          if governed != 190:
              raise SystemExit(f"governed member count is {governed}, expected 190")
          print("issued_ledger=76 receipts; observations=38; custody_census=190/190")
          PY

      # 8. Every matrix job builds the same no-mock fixture, then executes one
      # registry-selected decisive leg. core-authentic-success runs the authentic
      # CLI success exactly once; core-bidirectional-equality-audit runs the
      # bidirectional open/registry equality audit exactly once; each remaining
      # job runs one attack and its no-output/stage checks. The monolithic local
      # entry point remains available and enumerates the complete registry.
      # 9. REQUIRE_D117 turns an unavailable fixture or attempted skip into a
      # hard assertion failure rather than portable-proof evidence.
      - name: 8-9 - Run selected full-fixture proof leg without skips
        shell: bash
        env:
          JOULEWISE_D117_CUSTODY_STORE: ${{ runner.temp }}/d117-v2-custody-store
          JOULEWISE_REQUIRE_D117_FULL_FIXTURE: "1"
          JOULEWISE_D117_PROOF_PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_mint_floor_artifact_generalized.V2PinsetAndMintTests.test_d117_production_proof_split_partition
