name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs only. Docs pushes to main cost ~1.6 minutes, so
# queuing them is cheap; a later docs push must never cancel a code push's
# full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only paths are selected by classify_path below; docs-resident code
  # still runs the full matrix. Fail open on any ambiguity: a redundant full
  # run costs minutes; a false skip loses a fence.
  # F2-F5 remain unconditional in fences; build and installed-wheel also remain.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code || 'true' }}
    steps:
      # Checkout/detector errors must not block the heavy jobs via needs.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Classify changed paths (fail open)
        id: detect
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          classify_path() {
            # Under docs/, code extensions are .py .sh .zsh .bash .json .jsonl
            # .plist .toml .yaml .yml .cfg .ini; extensionless files are code too.
            case "$1" in
              docs/*)
                case "${1##*/}" in
                  *.py|*.sh|*.zsh|*.bash|*.json|*.jsonl|*.plist|*.toml|*.yaml|*.yml|*.cfg|*.ini)
                    echo code ;;
                  *.) echo code ;;
                  ?*.*) echo docs ;;
                  *) echo code ;;
                esac
                ;;
              */*) echo code ;;
              *.md) echo docs ;;
              *) echo code ;;
            esac
          }
          paths=$(mktemp)
          trap 'rm -f "$paths"' EXIT
          diff_ok=false
          case "$EVENT_NAME" in
            pull_request)
              if [ -n "$BASE_REF" ] &&
                 git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" &&
                 git diff --no-renames --name-only -z "origin/$BASE_REF...HEAD" -- > "$paths"; then
                diff_ok=true
              fi
              ;;
            push)
              if [ -n "$BEFORE_SHA" ] && [ -n "$HEAD_SHA" ] &&
                 [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ] &&
                 git diff --no-renames --name-only -z "$BEFORE_SHA" "$HEAD_SHA" -- > "$paths"; then
                diff_ok=true
              fi
              ;;
          esac
          code=true
          if [ "$diff_ok" = true ] && [ -s "$paths" ]; then
            code=false
            # NUL boundaries preserve unusual names; disabling renames includes
            # the old code path when a file is moved into a docs-only location.
            while IFS= read -r -d '' path; do
              kind=$(classify_path "$path")
              printf '%s: %q\n' "$kind" "$path"
              if [ "$kind" = code ]; then code=true; fi
            done < "$paths"
          else
            echo 'Diff unavailable, empty, or ambiguous; running the full matrix.'
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # F2 state generation, F3 explicit docs freshness, F4 historical receipt
  # semantics, and F5 CLI/strict mock smokes run once here, deliberately
  # ungated on every push and pull request, including docs-only changes.
  fences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: State kernel and generated-view drift
        run: python scripts/gen_state.py --check
      - name: Documentation freshness
        run: python -m unittest -v tests.test_docs_freshness
      - name: Historical receipt semantics
        run: python scripts/verify_receipt_histsem.py --repository-root . --require-published
      - name: CLI smoke - validate example configs
        run: |
          python -m joulewise validate-config configs/examples/mock_local.json
          python -m joulewise validate-config configs/examples/mac_mlx_local.json
      - name: Strict mock run, validate, reduce, and revalidate
        run: |
          set -euo pipefail
          line=$(python -m joulewise run configs/examples/mock_local.json --runs-dir ci-runs)
          echo "$line"
          bundle=${line#bundle: }
          bundle=${bundle%% *}
          python -m joulewise validate-bundle --strict "$bundle"
          python -m joulewise reduce "$bundle"
          python -m joulewise validate-bundle --strict "$bundle"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the supported floor (pyproject); 3.14 matches local dev.
        python-version: ["3.11", "3.14"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          # Golden provenance sidecars replay `git archive` against their
          # pinned base commit; a shallow checkout lacks that object.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Once-per-run state, receipt, and CLI/mock checks live in fences.
      - name: Compile Python sources
        run: python -m compileall -q joulewise tests
      - name: Install zsh (the night driver, its installer, and the emitted G2-a chain are zsh; tests invoke /bin/zsh)
        run: |
          # Tests require /bin/zsh: /usr/bin/zsh without that symlink is insufficient.
          if [ ! -x /bin/zsh ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q zsh
          fi
          test -x /bin/zsh
      - name: Unit tests (stdlib core only, per D-009/D-017)
        # test_calibration_exits AND test_calibration_writer_crash_matrix
        # are intentionally absent here (both carry exclusive_modules
        # declarations): their evidence makes fallback-weight shard
        # placement unsound; each runs once in its exclusive job below,
        # while the remaining four shards retain deterministic LPT balance
        # from the ordinary timing map.
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          import shard_tests

          overlay = json.loads(Path("scripts/test_timings.json").read_text())
          declarations = overlay["exclusive_modules"]
          exclusive = frozenset(declarations)
          discovered = shard_tests.discover_test_modules()
          assert exclusive <= set(discovered), (exclusive, discovered)
          timings = shard_tests.load_timing_map()
          for module, declaration in declarations.items():
              seconds = float(declaration["seconds"])
              threshold = float(declaration["fallback_rejection_threshold_seconds"])
              assert seconds >= threshold, (module, seconds, threshold)
              timings[module] = seconds
          ordinary = tuple(module for module in discovered if module not in exclusive)

          # UNIT-atomic, not module-atomic. A shard's floor used to be the
          # single largest MODULE, and tests.test_reduce alone is 1544 s --
          # larger than an even four-way share -- so NO shard count could
          # get below it. Modules named in split_modules are spread across
          # shards at test granularity instead. This edits no test file and
          # skips nothing: expand_units emits one unit per declared heavy
          # test plus ONE remainder unit holding every other test in that
          # module, and verify_split_declaration fails the build closed if
          # a declared id no longer exists.
          splits = {
              module: declaration
              for module, declaration in shard_tests.load_split_declarations().items()
              if module in set(ordinary)
          }
          unknown = shard_tests.conservative_unknown_weight()
          units, weights = shard_tests.expand_units(
              ordinary, timings, splits, unknown_weight=unknown
          )
          partitions = shard_tests.partition_modules(
              units, weights, 4, unknown_weight=unknown
          )
          totals = shard_tests.partition_totals(
              partitions, weights, unknown_weight=unknown
          )
          print("ORDINARY SHARD ESTIMATES", ",".join(f"{value:.3f}" for value in totals))
          index = int(os.environ["SHARD_INDEX"])
          raise SystemExit(shard_tests.run_units(partitions[index - 1], 4, index))
          PY

  calibration-exits-exclusive:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Exclusive by design: this module already runs sequentially internally;
    # colocating it with an ordinary shard only adds scheduler starvation.
    # The module watchdog ceiling is 10 minutes per child and this hosted job
    # retains the consult-dictated 30-minute absolute ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exclusive timing declaration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("scripts/test_timings.json").read_text())
          row = payload["exclusive_modules"]["tests.test_calibration_exits"]
          assert row["evidence_range_seconds"] == [648.0, 2036.0]
          assert row["seconds"] == 2036.0
          assert payload["seconds_by_module"]["tests.test_calibration_exits"] == row["seconds"]
          assert row["seconds"] >= row["fallback_rejection_threshold_seconds"]
          PY
      - name: Compile calibration-exit sources
        run: python -m compileall -q joulewise tests scripts/validate_powermetrics_fiducial.py
      - name: Exclusive calibration-exit module
        run: python -m unittest -v tests.test_calibration_exits

  calibration-writer-crash-matrix-exclusive:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Exclusive because fallback-weight shard placement is unsound for this
    # module: its hosted runtime is dominated by its own subprocess-heavy
    # cases — the same CPU-amplifying-fixture class WO-CALEXITS-RELIABILITY
    # fixed for test_calibration_exits, registered as
    # WO-CRASHMATRIX-RELIABILITY. Exclusivity buys FASTER ordinary-shard
    # signal; it does not shorten this module's own job.
    #
    # TEST-SPEED-01 (2026-08-23) changed two things here.
    #
    # 1. THE EVIDENCE PIN WAS STALE BY 2.7x. This job used to assert the
    #    module costs 5317.216 s, and its comment cited "~89 minutes". That
    #    figure was a 2026-08-11 observation of the module running inside a
    #    SHARED shard, taken BEFORE it was made exclusive; exclusivity is
    #    exactly what cured it. Measured today in its own job: 2005 s on
    #    3.11 and 1370 s on 3.14 (run 32621080380). The declaration now
    #    carries the current figure, and the 120-minute ceiling stands
    #    unchanged as headroom.
    #
    # 2. THE JOB IS NOW SPLIT IN TWO. Two of the 15 tests are 95.5% of the
    #    cost, so max-job time is floored at ~1385 s for EVERY split count
    #    >= 2 — K=3 and beyond buy literally zero wall clock and only burn
    #    concurrent-job budget, which is capped at 20. K=2 it is: ~33 min
    #    becomes ~23 min. The split is runner-side only, edits no test file,
    #    and skips nothing (see split_modules in scripts/test_timings.json:
    #    one declared heavy test, plus a remainder unit computed at run time
    #    that holds every other test in the module). Independence was
    #    audited AND the K=2 split was executed with both shards running
    #    concurrently on one machine — harsher than CI — with both passing.
    #
    # The residual ~23 min is ONE indivisible test method. No sharding
    # strategy goes below it; removing it is WO-CRASHMATRIX-RELIABILITY,
    # which changes test semantics and is out of TEST-SPEED-01's fence.
    # See docs/process_traces/2026-08-23-speed/.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exclusive timing declaration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("scripts/test_timings.json").read_text())
          module = "tests.test_calibration_writer_crash_matrix"
          row = payload["exclusive_modules"][module]
          assert row["evidence_range_seconds"] == [145.911, 2005.0]
          assert row["seconds"] == 1990.65
          assert payload["seconds_by_module"][module] == row["seconds"]
          assert row["seconds"] >= row["fallback_rejection_threshold_seconds"]
          # The split must account for the whole module: one declared heavy
          # test plus a remainder, summing to the declared cost.
          split = payload["split_modules"][module]
          declared = sum(float(value) for value in split["declared"].values())
          assert abs(declared + float(split["remainder_weight_seconds"]) - row["seconds"]) < 0.01
          PY
      - name: Compile calibration sources
        run: python -m compileall -q joulewise tests scripts/validate_powermetrics_fiducial.py
      - name: Exclusive calibration-writer crash-matrix module (shard ${{ matrix.shard }} of 2)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "scripts")
          import shard_tests

          module = "tests.test_calibration_writer_crash_matrix"
          timings = shard_tests.load_timing_map()
          splits = shard_tests.load_split_declarations()
          unknown = shard_tests.conservative_unknown_weight()
          # expand_units runs verify_split_declaration, which fails closed if
          # the declared heavy test id no longer exists. That is the case a
          # computed remainder would otherwise absorb in silence, handing one
          # shard ~20 minutes of unaccounted work while the weights disagree.
          units, weights = shard_tests.expand_units(
              (module,), timings, {module: splits[module]}, unknown_weight=unknown
          )
          partitions = shard_tests.partition_modules(
              units, weights, 2, unknown_weight=unknown
          )
          totals = shard_tests.partition_totals(
              partitions, weights, unknown_weight=unknown
          )
          print("CRASH-MATRIX SHARD ESTIMATES", ",".join(f"{v:.3f}" for v in totals))
          index = int(os.environ["SHARD_INDEX"])
          raise SystemExit(shard_tests.run_units(partitions[index - 1], 2, index))
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  installed-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist
      - name: Install wheel in a clean environment and smoke outside the repo
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/joulewise-venv"
          source "$RUNNER_TEMP/joulewise-venv/bin/activate"
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          python -m joulewise --help
          # Installed-layout behavioral smokes (post-merge integration
          # review XSI-1): both surfaces must fail closed outside a
          # checkout, never resolve into site-packages or guess.
          rc=0
          python -m joulewise determinism-gate > determinism_out.json || rc=$?
          test "$rc" -eq 2
          python - determinism_out.json <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert payload["verdict"] == "bundle_refused", payload["verdict"]
          assert "fewer_than_two_bundles" in payload["reason_codes"], payload
          PY
          python - <<'PY'
          from joulewise.analysis_manifest import validate_analysis_manifest
          from joulewise.analysis_manifest import SCHEMA_VERSION
          errors = validate_analysis_manifest(
              {
                  "schema_version": SCHEMA_VERSION,
                  "manifest_id": "am-" + "0" * 64,
                  "freeze_status": "frozen",
                  "design": {},
                  "source": {},
                  "entries": [],
                  "sentinel_links": [],
                  "families": [],
                  "contrasts": [],
              }
          )
          assert any(
              e.startswith("cannot infer the JouleWise repository root") for e in errors
          ), errors
          PY

  # The site observatory's publication chain and all site-lane tests
  # live in .github/workflows/site.yml — a separate failure domain that
  # never gates project CI (Ed directive 2026-08-03, D-101 addendum II).
