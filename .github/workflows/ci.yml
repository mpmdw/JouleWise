name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the supported floor (pyproject); 3.14 matches local dev.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Golden provenance sidecars replay `git archive` against their
          # pinned base commit; a shallow checkout lacks that object.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: State kernel and generated-view drift
        run: python scripts/gen_state.py --check
      - name: Compile Python sources
        run: python -m compileall -q joulewise tests
      - name: Unit tests (stdlib core only, per D-009/D-017)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke - validate example configs
        run: |
          python -m joulewise validate-config configs/examples/mock_local.json
          python -m joulewise validate-config configs/examples/mac_mlx_local.json
      - name: Strict mock run, validate, reduce, and revalidate
        run: |
          set -euo pipefail
          line=$(python -m joulewise run configs/examples/mock_local.json --runs-dir ci-runs)
          echo "$line"
          bundle=${line#bundle: }
          bundle=${bundle%% *}
          python -m joulewise validate-bundle --strict "$bundle"
          python -m joulewise reduce "$bundle"
          python -m joulewise validate-bundle --strict "$bundle"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  installed-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Install wheel in a clean environment and smoke outside the repo
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/joulewise-venv"
          source "$RUNNER_TEMP/joulewise-venv/bin/activate"
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          python -m joulewise --help
          # Installed-layout behavioral smokes (post-merge integration
          # review XSI-1): both surfaces must fail closed outside a
          # checkout, never resolve into site-packages or guess.
          rc=0
          python -m joulewise determinism-gate > determinism_out.json || rc=$?
          test "$rc" -eq 2
          python - determinism_out.json <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          assert payload["verdict"] == "bundle_refused", payload["verdict"]
          assert "fewer_than_two_bundles" in payload["reason_codes"], payload
          PY
          python - <<'PY'
          from joulewise.analysis_manifest import validate_analysis_manifest
          from joulewise.analysis_manifest import SCHEMA_VERSION
          errors = validate_analysis_manifest(
              {
                  "schema_version": SCHEMA_VERSION,
                  "manifest_id": "am-" + "0" * 64,
                  "freeze_status": "frozen",
                  "design": {},
                  "source": {},
                  "entries": [],
                  "sentinel_links": [],
                  "families": [],
                  "contrasts": [],
              }
          )
          assert any(
              e.startswith("cannot infer the JouleWise repository root") for e in errors
          ), errors
          PY

  release-chain:
    # ADVISORY ONLY (Ed directive 2026-08-01, D-101): the site/publication
    # chain gates nothing — this job may fail without failing CI. It still
    # runs to inform (logs, DRIFT context). Code correctness for these
    # modules is gated by the ordinary test job, not here.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site_capsule/package-lock.json
      - name: Install pinned publication build tools (network, no credentials)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix site_capsule ci --ignore-scripts --no-audit --no-fund
      - name: Verify emitted TypeScript with pinned esbuild
        run: python -m unittest -v tests.test_pack_capsule -k test_real_server_decoder_roundtrips_emitted_shard_and_rejects_corruption
      - name: Live-content site tests (advisory; D-101 addendum)
        env:
          JOULEWISE_SITE_CONTENT_TESTS: "1"
        run: python -m unittest -v tests.test_build_site_parsers
      - name: Exercise non-secret publication chain in a clean temporary snapshot
        env:
          JOULEWISE_MARKED_BIN: ${{ github.workspace }}/node_modules/.bin/marked
          JOULEWISE_LAKEBED_BIN: ${{ github.workspace }}/site_capsule/node_modules/.bin/lakebed
        run: python scripts/release_check.py --dry-run
