name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the supported floor (pyproject); 3.14 matches local dev.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib core only, per D-009/D-017)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke - validate example configs
        run: |
          python -m joulewise validate-config configs/examples/mock_local.json
          python -m joulewise validate-config configs/examples/mac_mlx_local.json
      - name: Mock end-to-end run + validate-bundle (slice 2E, D-017)
        run: |
          set -euo pipefail
          line=$(python -m joulewise run configs/examples/mock_local.json --runs-dir ci-runs)
          echo "$line"
          bundle=${line#bundle: }
          bundle=${bundle%% *}
          python -m joulewise validate-bundle "$bundle"
