<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="912" viewBox="0 0 1020 912" role="img" aria-labelledby="figBtitle figBdesc">
  <title id="figBtitle">Figure B (skeleton). Phase-energy means and fully composed intervals</title>
  <desc id="figBdesc">Skeleton for the phase-energy mean figure. Phase grouped by model on the horizontal axis; gross energy per request in joules on the vertical axis with no numeric scale. Each phase carries an unfilled reported-mean mark, an unfilled fully composed interval placeholder, and a visually distinct operative-floor reference glyph that is not an error bar. Independent valid-bundle counts and token-normalized companions are annotation placeholders. The whole figure is marked STOP_FILL; every D-123 supplier is unknown.</desc>
  <rect x="0" y="0" width="1020" height="912" fill="#ffffff"/>
  <text x="40" y="32" font-family="sans-serif" font-size="18" fill="#1b1b1b" font-weight="bold">Figure B (skeleton). Phase-energy means and fully composed intervals</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555555">Number-free skeleton. Mean marks, interval placeholders, and floor references are unfilled; no scale or ordering is implied.</text>
