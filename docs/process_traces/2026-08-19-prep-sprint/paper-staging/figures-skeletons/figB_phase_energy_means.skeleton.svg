  <line x1="40" y1="666" x2="980" y2="666" stroke="#e2e2e2" stroke-width="1.5"/>
  <text x="40" y="690" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Number-free caption stub (verbatim from docs/paper/figures-plan.md):</text>
  <text x="40" y="709" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">Reader-facing phase-energy means and fully composed measurement intervals from the prospectively registered alpha and beta reported-</text>
  <text x="40" y="726" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">mean cells. Independent valid-bundle counts accompany the marks; token-normalized companions remain table annotations under the</text>
  <text x="40" y="743" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">recorded-token and same-tokenizer rules.</text>
  <text x="40" y="769" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Mandatory D-119 disclosure line (verbatim; may be replaced only by weaker wording):</text>
  <text x="40" y="788" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">The plotted means are internal to the named software-counter boundary and become demonstrated results only when the D-123 reported-</text>
  <text x="40" y="805" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">mean artifact and its authenticated member basis issue; until then this figure has no data supplier.</text>
  <text x="40" y="831" font-family="sans-serif" font-size="11" fill="#555555">Registry rows consumed: sixteen D-123 mean/interval/companion tokens [E_*_J_per_request] [E_*_lower_J] [E_*_upper_J] [E_*_J_per_token], four count</text>
  <text x="40" y="848" font-family="sans-serif" font-size="11" fill="#555555">tokens [N_bundles_*], and the four operative-floor tokens from Figure A used only as clearly distinct floor references. Freeze status at audit: all</text>
  <text x="40" y="865" font-family="sans-serif" font-size="11" fill="#555555">twenty D-123 rows are STOP_FILL / SUPPLIER_UNKNOWN - the reported-mean artifact field, its admitted member basis, its composed interval endpoints, and</text>
  <text x="40" y="882" font-family="sans-serif" font-size="11" fill="#555555">its runtime-observed per-token companions are undefined in the repository.</text>
