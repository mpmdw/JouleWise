  <text x="40" y="74" font-family="sans-serif" font-size="11" fill="#a33">Render gate (plan): currently STOP_FILL - the registry marks every D-123 mean, interval, companion, and count supplier UNKNOWN. Do not substitute the</text>
  <text x="40" y="91" font-family="sans-serif" font-size="11" fill="#a33">absolute floor component's internal mean or count.</text>
