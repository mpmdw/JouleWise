  <text x="130" y="586" font-family="sans-serif" font-size="11.5" fill="#333333">Components are NOT stacked: the operative floor is the larger authenticated component, never their sum.</text>
  <line x1="40" y1="606" x2="980" y2="606" stroke="#e2e2e2" stroke-width="1.5"/>
  <text x="40" y="630" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Number-free caption stub (verbatim from docs/paper/figures-plan.md):</text>
  <text x="40" y="649" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">Absolute, comparative, and operative detection floors for the prospectively collected prompt-processing and token-generation cells.</text>
  <text x="40" y="666" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">The operative floor is the larger authenticated component, never their sum; any attribution-limited label and point-only diagnostic</text>
  <text x="40" y="683" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">are rendered only through the selected cell branch.</text>
  <text x="40" y="709" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Mandatory D-119 disclosure line (verbatim; may be replaced only by weaker wording):</text>
  <text x="40" y="728" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">These floors characterize only the named physical unit, software stack, telemetry boundary, and prospective alpha or beta evidence;</text>
  <text x="40" y="745" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">they do not validate absolute whole-system scale or rank a hardware class.</text>
  <text x="40" y="771" font-family="sans-serif" font-size="11" fill="#555555">Registry rows consumed: the twelve alpha/beta floor-cell tokens [F_1p5B_prompt_abs_J] [F_1p5B_prompt_cmp_J] [F_1p5B_prompt_operative_J]</text>
  <text x="40" y="788" font-family="sans-serif" font-size="11" fill="#555555">[F_1p5B_decode_abs_J] [F_1p5B_decode_cmp_J] [F_1p5B_decode_operative_J] [F_7B_prompt_abs_J] [F_7B_prompt_cmp_J] [F_7B_prompt_operative_J]</text>
  <text x="40" y="805" font-family="sans-serif" font-size="11" fill="#555555">[F_7B_decode_abs_J] [F_7B_decode_cmp_J] [F_7B_decode_operative_J]. Freeze status at audit: KEY_FROZEN / VALUE_UNISSUED (MEASURED components) and</text>
  <text x="40" y="822" font-family="sans-serif" font-size="11" fill="#555555">DERIVATION_FROZEN / VALUE_UNISSUED (operative maxima). Branch text for a refused or no-exact-floor cell comes from the TERMINAL_REFUSAL_REASON_*,</text>
  <text x="40" y="839" font-family="sans-serif" font-size="11" fill="#555555">NO_EXACT_FLOOR_REASON_*, AVAILABLE_DIAGNOSTIC_CLAUSE_* and POINT_DIAGNOSTIC_CLAUSE_* rows, never from this figure.</text>
