<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="869" viewBox="0 0 1020 869" role="img" aria-labelledby="figAtitle figAdesc">
  <title id="figAtitle">Figure A (skeleton). Phase-floor composition</title>
  <desc id="figAdesc">Skeleton for the phase-floor composition figure. Four model-and-phase cells on the horizontal axis; energy in joules on the vertical axis with no numeric scale. Each cell carries three unfilled mark placeholders - absolute component, comparative component, and operative component maximum - keyed by their results-fill-registry row tokens. Components are never stacked. The whole figure is marked STOP_FILL and contains no measured data and no numbers.</desc>
  <rect x="0" y="0" width="1020" height="869" fill="#ffffff"/>
  <text x="40" y="32" font-family="sans-serif" font-size="18" fill="#1b1b1b" font-weight="bold">Figure A (skeleton). Phase-floor composition</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555555">Number-free skeleton. No value, scale, or ordering is implied; every mark below is an unissued placeholder.</text>
  <rect x="790" y="16" width="190" height="26" rx="3" fill="#ffffff" stroke="#a33" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="885.0" y="30" font-family="sans-serif" font-size="11.5" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">STOP_FILL - NO PANEL RENDERS</text>
  <text x="40" y="74" font-family="sans-serif" font-size="11" fill="#a33">Render gate (plan): every cited component must be exact and authenticated, each cell must select its licensed publication branch, and the derived</text>
  <text x="40" y="91" font-family="sans-serif" font-size="11" fill="#a33">maximum must match the artifact's floor_gate_j; otherwise omit or refuse the affected cell exactly as the registry directs.</text>
