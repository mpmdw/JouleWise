  <text x="885.0" y="30" font-family="sans-serif" font-size="11.5" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">STOP_FILL - NO PANEL RENDERS</text>
  <text x="40" y="74" font-family="sans-serif" font-size="11" fill="#a33">Render gate (plan): currently STOP_FILL - the characterization report schema and all cited output fields are SUPPLIER_UNKNOWN in the registry.</text>
