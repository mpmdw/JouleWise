<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="883" viewBox="0 0 1020 883" role="img" aria-labelledby="figDtitle figDdesc">
  <title id="figDtitle">Figure D (skeleton). Known-signal characterization</title>
  <desc id="figDdesc">Skeleton for the known-signal characterization figure. Three panels: linearity with output tokens against energy and an unfilled slope annotation; null response with registered output-magnitude conditions against signed A/B/B/A difference about an unlabelled zero rule; and empirical floor with registered micro-difference conditions against a dimensionless effect-to-floor ratio. Every mark is an unissued placeholder keyed by its registry row token. All three panels are marked STOP_FILL because the characterization report schema and every cited output field are supplier-unknown.</desc>
  <rect x="0" y="0" width="1020" height="883" fill="#ffffff"/>
  <text x="40" y="32" font-family="sans-serif" font-size="18" fill="#1b1b1b" font-weight="bold">Figure D (skeleton). Known-signal characterization</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555555">Number-free skeleton, three panels. No slope, band, ratio, or condition value is drawn; the characterization schema does not exist.</text>
