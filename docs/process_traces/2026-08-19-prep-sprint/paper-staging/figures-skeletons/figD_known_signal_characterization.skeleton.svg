  <text x="40" y="644" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Number-free caption stub (verbatim from docs/paper/figures-plan.md):</text>
  <text x="40" y="663" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">Characterization of response linearity, null behavior across registered magnitudes, and empirical behavior around the operative</text>
  <text x="40" y="680" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">floor. Panels report the issued row outcome and show numeric diagnostics only when the row-specific presence guard licenses them.</text>
  <text x="40" y="706" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Mandatory D-119 disclosure line (verbatim; may be replaced only by weaker wording):</text>
  <text x="40" y="725" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">These panels demonstrate instrument behavior only if the separately governed characterization window passes its whole-window verdict</text>
  <text x="40" y="742" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">and the corresponding registered row is supported; any partial value from a refused or mixed row remains explicitly diagnostic.</text>
  <text x="40" y="768" font-family="sans-serif" font-size="11" fill="#555555">Registry rows consumed: linearity [S_C_linearity_request_J_per_token] [S_C_linearity_decode_J_per_token] [R_C_linearity_limit_J]; null response</text>
  <text x="40" y="785" font-family="sans-serif" font-size="11" fill="#555555">[D_C_null_max_abs_J]; empirical floor [R_C_micro_min_x_floor] [R_C_micro_max_x_floor]; mixed/refused branches [PLAIN_LANGUAGE_RESULT_linearity]</text>
  <text x="40" y="802" font-family="sans-serif" font-size="11" fill="#555555">[PLAIN_LANGUAGE_RESULT_null] [PLAIN_LANGUAGE_RESULT_floor] [D_C_linearity_diagnostic_J_per_token] [D_C_null_diagnostic_J]</text>
  <text x="40" y="819" font-family="sans-serif" font-size="11" fill="#555555">[D_C_micro_diagnostic_x_floor]. Freeze status at audit: every one of these rows is STOP_FILL / SUPPLIER_UNKNOWN; no repository file in the authority</text>
  <text x="40" y="836" font-family="sans-serif" font-size="11" fill="#555555">set defines a characterization result schema. A whole-window refusal renders through [REFUSAL_REASON_window_C] with [PRESENT_DIAGNOSTIC_LIST] and</text>
  <text x="40" y="853" font-family="sans-serif" font-size="11" fill="#555555">[ABSENT_DIAGNOSTIC_ROW_LIST].</text>
