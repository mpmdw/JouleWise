  <text x="110" y="560" font-family="sans-serif" font-size="11.5" fill="#333333">Joules, joules per token, and seconds are never overlaid on one dual scale; each panel keeps its own vertical axis.</text>
  <line x1="40" y1="578" x2="980" y2="578" stroke="#e2e2e2" stroke-width="1.5"/>
  <text x="40" y="602" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Number-free caption stub (verbatim from docs/paper/figures-plan.md):</text>
  <text x="40" y="621" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">Internal phase-accounting, drift, and settling diagnostics from the governed characterization campaign. Additivity and prompt-</text>
  <text x="40" y="638" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">invariance test phase assignment; reference excursion and recovery test the admitted temporal regime; between-session language</text>
  <text x="40" y="655" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">follows only the registered eligibility rule.</text>
  <text x="40" y="681" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Mandatory D-119 disclosure line (verbatim; may be replaced only by weaker wording):</text>
  <text x="40" y="700" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">These diagnostics test internal consistency and stability under the recorded stack and admitted sessions; they do not validate the</text>
  <text x="40" y="717" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">software counter's external gain, establish unrestricted cross-session transfer, or convert a refused window into evidence of</text>
  <text x="40" y="734" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">stability.</text>
  <text x="40" y="760" font-family="sans-serif" font-size="11" fill="#555555">Registry rows consumed: phase consistency [D_C_additivity_J] [S_C_prompt_invariance_J_per_token] [B_C_prompt_invariance_J_per_token]; drift and</text>
  <text x="40" y="777" font-family="sans-serif" font-size="11" fill="#555555">settling [D_C_reference_excursion_J] [T_C_recovery_s]; row outcomes and refused-window diagnostics [PLAIN_LANGUAGE_RESULT_phase]</text>
  <text x="40" y="794" font-family="sans-serif" font-size="11" fill="#555555">[PLAIN_LANGUAGE_RESULT_drift] [D_C_phase_diagnostic_J] [D_C_drift_diagnostic_J]; between-session context [PLAIN_LANGUAGE_RESULT_between_sessions]</text>
  <text x="40" y="811" font-family="sans-serif" font-size="11" fill="#555555">[N_C_eligible_sessions]. Freeze status at audit: every one of these rows is STOP_FILL / SUPPLIER_UNKNOWN. [B_C_prompt_invariance_J_per_token] must be</text>
  <text x="40" y="828" font-family="sans-serif" font-size="11" fill="#555555">pre-registered before any band is drawn.</text>
