<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="858" viewBox="0 0 1020 858" role="img" aria-labelledby="figEtitle figEdesc">
  <title id="figEtitle">Figure E (skeleton). Phase consistency, drift, and settling</title>
  <desc id="figEdesc">Skeleton for the phase-consistency and temporal-behaviour figure. Four panels, each with its own vertical scale: additivity residual in joules about an unlabelled zero rule; prompt-invariance slope in joules per token with an unissued frozen acceptance band; reference excursion in joules; and recovery time in seconds. Between-session eligibility is caption context, not an axis. Every mark is an unissued placeholder keyed by its registry row token, and all four panels are marked STOP_FILL.</desc>
  <rect x="0" y="0" width="1020" height="858" fill="#ffffff"/>
  <text x="40" y="32" font-family="sans-serif" font-size="18" fill="#1b1b1b" font-weight="bold">Figure E (skeleton). Phase consistency, drift, and settling</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555555">Number-free skeleton, four separately scaled panels. Joules, joules per token, and seconds never share an axis; no dual-scale overlay.</text>
