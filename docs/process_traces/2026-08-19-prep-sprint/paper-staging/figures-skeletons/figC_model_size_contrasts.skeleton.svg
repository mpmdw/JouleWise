  <circle cx="315.0" cy="264.0" r="8" fill="#ffffff" stroke="#1b6ca8" stroke-width="2.2"/>
  <text x="315.0" y="244.0" font-family="sans-serif" font-size="15" fill="#1b6ca8" font-weight="bold" text-anchor="middle">?</text>
