  <text x="126" y="270.0" font-family="sans-serif" font-size="10" fill="#555555" text-anchor="middle" transform="rotate(-90 126 270.0)">no numeric scale: values unissued</text>
  <line x1="150" y1="270.0" x2="700" y2="270.0" stroke="#333333" stroke-width="2"/>
  <text x="142" y="274.0" font-family="sans-serif" font-size="11" fill="#555555" text-anchor="end">zero</text>
  <line x1="150" y1="208.0" x2="700" y2="208.0" stroke="#6a6a6a" stroke-width="1.6" stroke-dasharray="9 6"/>
  <line x1="150" y1="332.0" x2="700" y2="332.0" stroke="#6a6a6a" stroke-width="1.6" stroke-dasharray="9 6"/>
  <rect x="150" y="208.0" width="550" height="124" fill="#bbbbbb" fill-opacity="0.16"/>
  <text x="692" y="202.0" font-family="sans-serif" font-size="10.5" fill="#5a5a5a" text-anchor="end">armwise floor magnitude, drawn symmetrically about zero (reference only)</text>
  <text x="692" y="350.0" font-family="monospace" font-size="9.5" fill="#5a5a5a" text-anchor="end">[F_claim_decode_armwise_max_J]</text>
  <line x1="315.0" y1="146" x2="315.0" y2="394" stroke="#1b6ca8" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="302.0" y1="146" x2="328.0" y2="146" stroke="#1b6ca8" stroke-width="2.4"/>
