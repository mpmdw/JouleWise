  <text x="315.0" y="462" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[E_decode_contrast_signed_J_per_request]</text>
  <text x="315.0" y="475" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[E_decode_contrast_lower_J]</text>
  <text x="315.0" y="488" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[E_decode_contrast_upper_J]</text>
  <text x="315.0" y="501" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[M_decode_contrast_abs_J_per_request]</text>
  <rect x="273.0" y="520" width="84" height="18" rx="3" fill="#ffffff" stroke="#a33" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="315.0" y="534" font-family="sans-serif" font-size="11.5" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">STOP_FILL</text>
  <rect x="469.0" y="146" width="176" height="248" fill="#ffffff" stroke="#a33" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="557.0" y="248.0" font-family="sans-serif" font-size="13" fill="#a33" font-weight="bold" text-anchor="middle">NO TOKEN FAMILY</text>
  <text x="557.0" y="268.0" font-family="sans-serif" font-size="11" fill="#a33" text-anchor="middle">D-122 prompt contrast arm is</text>
  <text x="557.0" y="284.0" font-family="sans-serif" font-size="11" fill="#a33" text-anchor="middle">required but unregistered in the</text>
  <text x="557.0" y="300.0" font-family="sans-serif" font-size="11" fill="#a33" text-anchor="middle">binding template vocabulary</text>
  <text x="557.0" y="444" font-family="sans-serif" font-size="12.5" fill="#1b1b1b" font-weight="bold" text-anchor="middle">prompt processing (256-token)</text>
  <text x="557.0" y="462" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">registry discrepancy row:</text>
  <text x="557.0" y="475" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">"Gamma prompt-processing contrast"</text>
  <rect x="515.0" y="520" width="84" height="18" rx="3" fill="#ffffff" stroke="#a33" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="557.0" y="534" font-family="sans-serif" font-size="11.5" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">STOP_FILL</text>
  <line x1="150" y1="420" x2="700" y2="420" stroke="#333333" stroke-width="1.8"/>
  <text x="425.0" y="454" font-family="sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle"></text>
  <text x="425.0" y="556" font-family="sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle">registered phase contrast</text>
  <rect x="730" y="120" width="240" height="300" rx="4" fill="#fafafa" stroke="#999999" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="850" y="144" font-family="sans-serif" font-size="11.5" fill="#1b1b1b" font-weight="bold" text-anchor="middle">CAPTION-ONLY DISCLOSURE</text>
  <text x="850" y="160" font-family="sans-serif" font-size="10.5" fill="#555555" text-anchor="middle">never plotted, never a threshold</text>
  <text x="850" y="184" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[B_decode_claim_J]</text>
  <text x="850" y="199" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[S_decode_joint_J]</text>
  <text x="742" y="226" font-family="sans-serif" font-size="10.5" fill="#333333">The claim-side bound and the</text>
  <text x="742" y="240" font-family="sans-serif" font-size="10.5" fill="#333333">floor-plus-claim-bound sum are</text>
  <text x="742" y="254" font-family="sans-serif" font-size="10.5" fill="#333333">sizing disclosures. They are</text>
  <text x="742" y="268" font-family="sans-serif" font-size="10.5" fill="#333333">reported beside the figure and are</text>
  <text x="742" y="282" font-family="sans-serif" font-size="10.5" fill="#333333">never drawn as an acceptance</text>
  <text x="742" y="296" font-family="sans-serif" font-size="10.5" fill="#333333">threshold; the decision interval</text>
  <text x="742" y="310" font-family="sans-serif" font-size="10.5" fill="#333333">is never compared with the sum.</text>
  <text x="850" y="336" font-family="sans-serif" font-size="11" fill="#1b1b1b" font-weight="bold" text-anchor="middle">DERIVED ANNOTATIONS</text>
  <text x="850" y="356" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[C_decode_floor_clearance_J]</text>
  <text x="850" y="370" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[S_decode_floor_shortfall_J]</text>
  <text x="850" y="384" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[R_decode_effect_x_floor]</text>
  <text x="850" y="398" font-family="monospace" font-size="9.5" fill="#1b6ca8" text-anchor="middle">[CELL_NONPUBLICATION_SUMMARY]</text>
  <rect x="808" y="420" width="84" height="18" rx="3" fill="#ffffff" stroke="#a33" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="850.0" y="434" font-family="sans-serif" font-size="11.5" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">STOP_FILL</text>
  <text x="150" y="588" font-family="sans-serif" font-size="11.5" fill="#333333">Floor clearance is evaluated on magnitude; direction is evaluated separately from the fully composed interval and the</text>
  <text x="150" y="604" font-family="sans-serif" font-size="11.5" fill="#333333">registered direction. The two gates are never merged.</text>
  <circle cx="160" cy="614" r="7" fill="#ffffff" stroke="#1b6ca8" stroke-width="2.2"/>
  <text x="176" y="618" font-family="sans-serif" font-size="11.5" fill="#333333">signed point estimate (placeholder)</text>
  <rect x="422.5" y="607" width="20" height="14" fill="#bbbbbb" fill-opacity="0.25" stroke="#888888" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="448.5" y="618" font-family="sans-serif" font-size="11.5" fill="#333333">armwise floor magnitude reference</text>
  <line x1="40" y1="634" x2="980" y2="634" stroke="#e2e2e2" stroke-width="1.5"/>
  <text x="40" y="658" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Number-free caption stub (verbatim from docs/paper/figures-plan.md):</text>
  <text x="40" y="677" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">Prospectively registered model-size contrasts on the named stack, with signed point estimates, fully composed intervals, and armwise</text>
  <text x="40" y="694" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">detection floors. Floor clearance is evaluated on magnitude, while direction is evaluated from the interval and registered</text>
  <text x="40" y="711" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">direction; an unresolved or refused contrast is not equality or zero effect.</text>
  <text x="40" y="737" font-family="sans-serif" font-size="12" fill="#555555" font-weight="bold">Mandatory D-119 disclosure line (verbatim; may be replaced only by weaker wording):</text>
  <text x="40" y="756" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">A directional statement appears only for a contrast whose authenticated claim artifact passes every applicable floor, interval-</text>
  <text x="40" y="773" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">direction, multiplicity, and evidence gate; otherwise the figure uses the weaker refusal or unresolved wording carried by that</text>
  <text x="40" y="790" font-family="sans-serif" font-size="12.5" fill="#1b1b1b">artifact.</text>
  <text x="40" y="816" font-family="sans-serif" font-size="11" fill="#555555">Registry rows consumed: [E_decode_contrast_signed_J_per_request] [E_decode_contrast_lower_J] [E_decode_contrast_upper_J]</text>
  <text x="40" y="833" font-family="sans-serif" font-size="11" fill="#555555">[M_decode_contrast_abs_J_per_request] [F_claim_decode_armwise_max_J] [C_decode_floor_clearance_J] [S_decode_floor_shortfall_J]</text>
  <text x="40" y="850" font-family="sans-serif" font-size="11" fill="#555555">[R_decode_effect_x_floor]; [B_decode_claim_J] and [S_decode_joint_J] for caption disclosure only; plus the registry's Gamma prompt-processing contrast</text>
  <text x="40" y="867" font-family="sans-serif" font-size="11" fill="#555555">discrepancy row pending a D-122-compliant prompt token family. Freeze status at audit: MEASURED gamma rows are KEY_FROZEN / VALUE_UNISSUED, the</text>
  <text x="40" y="884" font-family="sans-serif" font-size="11" fill="#555555">derived rows are DERIVATION_FROZEN / VALUE_UNISSUED, and [B_decode_claim_J] is STOP_FILL / SUPPLIER_UNKNOWN, which also blocks [S_decode_joint_J]. Per</text>
  <text x="40" y="901" font-family="sans-serif" font-size="11" fill="#555555">D-124 the common-mode estimator identity and its block-timescale stationarity/transfer assumption must be disclosed beside this figure, together with</text>
  <text x="40" y="918" font-family="sans-serif" font-size="11" fill="#555555">the statement that historical evidence bounded the errors but did not observe realized member-level edge errors.</text>
</svg>
