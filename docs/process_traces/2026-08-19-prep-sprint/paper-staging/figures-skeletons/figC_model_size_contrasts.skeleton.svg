<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="948" viewBox="0 0 1020 948" role="img" aria-labelledby="figCtitle figCdesc">
  <title id="figCtitle">Figure C (skeleton). Registered model-size contrasts, with floor and direction kept separate</title>
  <desc id="figCdesc">Skeleton for the model-size contrast figure. Registered phase contrasts on the horizontal axis; signed model-size difference in joules per request on the vertical axis, oriented larger model minus smaller model, with an unlabelled zero rule. The token-generation contrast carries an unfilled point estimate and an unfilled fully composed interval, plus a symmetric armwise floor-magnitude reference drawn about zero. The prompt-processing contrast is drawn as a missing token family, not as a value. Floor-plus-claim-bound disclosure is caption-only and is never drawn as a decision threshold. The whole figure is marked STOP_FILL.</desc>
  <rect x="0" y="0" width="1020" height="948" fill="#ffffff"/>
  <text x="40" y="32" font-family="sans-serif" font-size="18" fill="#1b1b1b" font-weight="bold">Figure C (skeleton). Registered model-size contrasts, with floor and direction kept separate</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555555">Number-free skeleton. Signed axis is oriented larger model minus smaller model; no magnitude, sign, or threshold is implied.</text>
  <rect x="790" y="16" width="190" height="26" rx="3" fill="#ffffff" stroke="#a33" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="885.0" y="30" font-family="sans-serif" font-size="11.5" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">STOP_FILL - NO PANEL RENDERS</text>
  <text x="40" y="74" font-family="sans-serif" font-size="11" fill="#a33">Render gate (plan): decode remains blocked on the unknown claim-side-bound binding where that disclosure is used. Prompt processing remains STOP_FILL</text>
  <text x="40" y="91" font-family="sans-serif" font-size="11" fill="#a33">until the lead-owned draft/template train adds the D-122 token family and gamma supplies the corresponding issued contrast row.</text>
  <g opacity="0.085" transform="rotate(-24 425.0 270.0)">
  <text x="425.0" y="270.0" font-family="sans-serif" font-size="108" fill="#a33" font-weight="bold" text-anchor="middle" letter-spacing="10">STOP_FILL</text>
  </g>
  <g stroke="#ececec" stroke-width="1.5">
    <line x1="150" y1="120" x2="700" y2="120"/>
    <line x1="150" y1="180" x2="700" y2="180"/>
    <line x1="150" y1="270.0" x2="700" y2="270.0"/>
    <line x1="150" y1="360" x2="700" y2="360"/>
    <line x1="150" y1="420" x2="700" y2="420"/>
  </g>
