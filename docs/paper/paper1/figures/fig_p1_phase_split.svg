<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Phase split by overlap, schematic">
<title>Phase split by overlap, schematic</title>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1a1a1a}
.t{font-size:15px;font-weight:bold}.s{font-size:12px}.xs{font-size:10.5px}.note{font-size:10.5px;font-style:italic;fill:#555}
.box{fill:#f2f4f7;stroke:#4a5568;stroke-width:1.2}.blue{fill:#dbe8f7;stroke:#2b6cb0;stroke-width:1.2}
.orange{fill:#fdebd3;stroke:#c05621;stroke-width:1.2}.green{fill:#dcf2e3;stroke:#2f855a;stroke-width:1.2}
.grey{fill:#e2e8f0;stroke:#4a5568;stroke-width:1}.red{fill:#fde2e2;stroke:#c53030;stroke-width:1.2}
.line{stroke:#1a1a1a;stroke-width:1.2;fill:none}.dash{stroke:#1a1a1a;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.arrow{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b6cb0" stroke-width="2"/></pattern></defs>
<rect width="900" height="420" fill="#ffffff"/>
<text x="20" y="26" class="t" text-anchor="start">Phase split by time overlap, and the energy moved when an edge moves</text>
<line x1="80" y1="300" x2="860" y2="300" class="line"/>
<line x1="80" y1="300" x2="80" y2="60" class="line"/>
<text x="880" y="304" class="s" text-anchor="end">time</text>
<text x="30" y="180" class="s" transform="rotate(-90 30 180)" text-anchor="middle">average power</text>
<rect x="120" y="210" width="130" height="90" class="grey" rx="0"/>
<text x="185.0" y="318" class="xs" text-anchor="middle">record 1</text>
<rect x="250" y="130" width="130" height="170" class="grey" rx="0"/>
<text x="315.0" y="318" class="xs" text-anchor="middle">record 2</text>
<rect x="380" y="100" width="130" height="200" class="grey" rx="0"/>
<text x="445.0" y="318" class="xs" text-anchor="middle">record 3</text>
<rect x="510" y="150" width="130" height="150" class="grey" rx="0"/>
<text x="575.0" y="318" class="xs" text-anchor="middle">record 4</text>
<rect x="640" y="160" width="130" height="140" class="grey" rx="0"/>
<text x="705.0" y="318" class="xs" text-anchor="middle">record 5</text>
<rect x="390" y="100" width="40" height="200" fill="url(#hatch)" opacity="0.8"/>
<line x1="430" y1="70" x2="430" y2="300" class="line"/>
<line x1="390" y1="90" x2="390" y2="300" class="dash"/>
<text x="436" y="84" class="xs" text-anchor="start">recorded edge (first output token)</text>
<text x="382" y="150" class="xs" text-anchor="end">edge moved by g</text>
<text x="250" y="60" class="s" text-anchor="middle">PREFILL</text>
<text x="640" y="60" class="s" text-anchor="middle">DECODE</text>
<path d="M390 118 L430 118" class="arrow"/>
<text x="410.0" y="132" class="xs" text-anchor="middle">g</text>
<rect x="560" y="330" width="320" height="64" class="box" rx="4"/>
<text x="570" y="350" class="xs" text-anchor="start">Each record shares its energy between phases</text>
<text x="570" y="366" class="xs" text-anchor="start">in proportion to its time overlap with each.</text>
<text x="570" y="382" class="xs" text-anchor="start">Hatched: energy reassigned if the edge moves by g.</text>
<rect x="80" y="330" width="450" height="64" class="box" rx="4"/>
<text x="90" y="350" class="xs" text-anchor="start">Assigned prefill energy = sum over records of power × overlap.</text>
<text x="90" y="366" class="xs" text-anchor="start">Moving an edge moves energy between phases; the request</text>
<text x="90" y="382" class="xs" text-anchor="start">total is unchanged. Power within a record is unknown.</text>
<text x="890" y="412" text-anchor="end" class="note">Schematic. No measured data; all values and widths illustrative, not to scale.</text>
</svg>
