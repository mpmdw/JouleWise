<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Research pipeline, schematic">
<title>Research pipeline, schematic</title>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1a1a1a}
.t{font-size:15px;font-weight:bold}.s{font-size:12px}.xs{font-size:10.5px}.note{font-size:10.5px;font-style:italic;fill:#555}
.box{fill:#f2f4f7;stroke:#4a5568;stroke-width:1.2}.blue{fill:#dbe8f7;stroke:#2b6cb0;stroke-width:1.2}
.orange{fill:#fdebd3;stroke:#c05621;stroke-width:1.2}.green{fill:#dcf2e3;stroke:#2f855a;stroke-width:1.2}
.grey{fill:#e2e8f0;stroke:#4a5568;stroke-width:1}.red{fill:#fde2e2;stroke:#c53030;stroke-width:1.2}
.line{stroke:#1a1a1a;stroke-width:1.2;fill:none}.dash{stroke:#1a1a1a;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.arrow{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b6cb0" stroke-width="2"/></pattern></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="20" y="26" class="t" text-anchor="start">The research pipeline: who may touch what</text>
<rect x="20" y="50" width="280" height="300" class="blue" rx="6"/>
<text x="30" y="70" class="s" text-anchor="start">CLOUD (agents)</text>
<rect x="35" y="84" width="250" height="38" class="box" rx="4"/>
<text x="45" y="107" class="xs" text-anchor="start">registrations, judged and refuted</text>
<rect x="35" y="134" width="250" height="38" class="box" rx="4"/>
<text x="45" y="157" class="xs" text-anchor="start">code, executing reviews (2 families)</text>
<rect x="35" y="184" width="250" height="38" class="box" rx="4"/>
<text x="45" y="207" class="xs" text-anchor="start">synthetic full-size tests, CI</text>
<rect x="35" y="234" width="250" height="38" class="box" rx="4"/>
<text x="45" y="257" class="xs" text-anchor="start">independent recompute and twin (built)</text>
<rect x="35" y="284" width="250" height="38" class="box" rx="4"/>
<text x="45" y="307" class="xs" text-anchor="start">paper text with placeholders</text>
<rect x="330" y="50" width="260" height="300" class="orange" rx="6"/>
<text x="340" y="70" class="s" text-anchor="start">MEASUREMENT LAPTOP (no agents)</text>
<rect x="345" y="84" width="230" height="38" class="box" rx="4"/>
<text x="355" y="107" class="xs" text-anchor="start">agent census + hazard arm</text>
<rect x="345" y="134" width="230" height="38" class="box" rx="4"/>
<text x="355" y="157" class="xs" text-anchor="start">session (about 6 h)</text>
<rect x="345" y="184" width="230" height="38" class="box" rx="4"/>
<text x="355" y="207" class="xs" text-anchor="start">harvest: flags, exclusions</text>
<rect x="345" y="234" width="230" height="38" class="box" rx="4"/>
<text x="355" y="257" class="xs" text-anchor="start">structure only leaves</text>
<rect x="345" y="284" width="230" height="38" class="box" rx="4"/>
<text x="355" y="307" class="xs" text-anchor="start">hash-verified packaging</text>
<rect x="620" y="50" width="260" height="300" class="green" rx="6"/>
<text x="630" y="70" class="s" text-anchor="start">ANALYSIS HOST (restricted)</text>
<rect x="635" y="84" width="230" height="38" class="box" rx="4"/>
<text x="645" y="107" class="xs" text-anchor="start">blind dry run: structure only</text>
<rect x="635" y="134" width="230" height="38" class="box" rx="4"/>
<text x="645" y="157" class="xs" text-anchor="start">release event (digests tied)</text>
<rect x="635" y="184" width="230" height="38" class="box" rx="4"/>
<text x="645" y="207" class="xs" text-anchor="start">registered analysis</text>
<rect x="635" y="234" width="230" height="38" class="box" rx="4"/>
<text x="645" y="257" class="xs" text-anchor="start">independent recompute + compare</text>
<rect x="635" y="284" width="230" height="38" class="box" rx="4"/>
<text x="645" y="307" class="xs" text-anchor="start">fill placeholders, print</text>
<path d="M285 103 L345 103" class="arrow"/>
<text x="315" y="96" class="xs" text-anchor="middle">sealed</text>
<path d="M575 303 L635 103" class="arrow"/>
<text x="605" y="190" class="xs" text-anchor="middle">data</text>
<path d="M575 253 C 600 380, 160 380, 160 340" class="arrow"/>
<text x="400" y="372" class="xs" text-anchor="middle">structure only (verdicts, counts)</text>
<text x="890" y="392" text-anchor="end" class="note">Schematic. No measured data; all values and widths illustrative, not to scale.</text>
</svg>
