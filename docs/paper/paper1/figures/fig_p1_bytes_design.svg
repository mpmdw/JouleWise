<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="BYTES design, schematic">
<title>BYTES design, schematic</title>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#1a1a1a}
.t{font-size:15px;font-weight:bold}.s{font-size:12px}.xs{font-size:10.5px}.note{font-size:10.5px;font-style:italic;fill:#555}
.box{fill:#f2f4f7;stroke:#4a5568;stroke-width:1.2}.blue{fill:#dbe8f7;stroke:#2b6cb0;stroke-width:1.2}
.orange{fill:#fdebd3;stroke:#c05621;stroke-width:1.2}.green{fill:#dcf2e3;stroke:#2f855a;stroke-width:1.2}
.grey{fill:#e2e8f0;stroke:#4a5568;stroke-width:1}.red{fill:#fde2e2;stroke:#c53030;stroke-width:1.2}
.line{stroke:#1a1a1a;stroke-width:1.2;fill:none}.dash{stroke:#1a1a1a;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.arrow{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#ah)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2b6cb0" stroke-width="2"/></pattern></defs>
<rect width="900" height="350" fill="#ffffff"/>
<text x="20" y="26" class="t" text-anchor="start">BYTES: three rival lines fixed on the fit set, then tested on held-out models</text>
<line x1="70" y1="300" x2="380" y2="300" class="line"/>
<line x1="70" y1="300" x2="70" y2="60" class="line"/>
<text x="380" y="294" class="xs" text-anchor="end">x = b, R or τ</text>
<text x="40" y="180" class="xs" transform="rotate(-90 40 180)" text-anchor="middle">energy per decode pass e</text>
<circle cx="110" cy="250" r="5" fill="#2b6cb0"/>
<line x1="110" y1="240" x2="110" y2="260" class="line"/>
<circle cx="160" cy="215" r="5" fill="#2b6cb0"/>
<line x1="160" y1="205" x2="160" y2="225" class="line"/>
<circle cx="230" cy="170" r="5" fill="#2b6cb0"/>
<line x1="230" y1="160" x2="230" y2="180" class="line"/>
<line x1="90" y1="265" x2="360" y2="92" class="line"/>
<line x1="90" y1="258" x2="360" y2="102" class="dash"/>
<line x1="90" y1="272" x2="360" y2="84" class="dash"/>
<text x="120" y="280" class="xs" text-anchor="start">fit set: 3 dense models</text>
<text x="200" y="70" class="xs" text-anchor="start">committed line + corner lines</text>
<path d="M335 110 L335 75" class="line"/>
<rect x="310" y="96" width="50" height="24" class="blue" rx="2"/>
<text x="335" y="112" class="xs" text-anchor="middle">pred.</text>
<rect x="320" y="140" width="30" height="30" class="orange" rx="2"/>
<text x="335" y="182" class="xs" text-anchor="middle">measured</text>
<text x="220" y="322" class="xs" text-anchor="middle">Prediction interval at a held-out x vs the measured interval</text>
<rect x="430" y="60" width="440" height="150" class="box" rx="4"/>
<text x="440" y="80" class="s" text-anchor="start">For each held-out model and boundary (rails, DC input, rest):</text>
<text x="450" y="104" class="s" text-anchor="start">bytes / resident / time</text>
<text x="620" y="104" class="xs" text-anchor="start">exactly one line consistent</text>
<text x="450" y="126" class="s" text-anchor="start">unresolved</text>
<text x="620" y="126" class="xs" text-anchor="start">two or more consistent (expected for dense models)</text>
<text x="450" y="148" class="s" text-anchor="start">neither</text>
<text x="620" y="148" class="xs" text-anchor="start">no line consistent; log ratios show the misses</text>
<text x="440" y="180" class="s" text-anchor="start">MoE models only: active / resident / mixed</text>
<text x="440" y="198" class="xs" text-anchor="start">H2: decode power vs bandwidth (and resident bytes per second)</text>
<rect x="430" y="230" width="80" height="64" class="green" rx="3"/>
<text x="470" y="248" class="xs" text-anchor="middle">blinded:</text>
<text x="470" y="261" class="xs" text-anchor="middle">rails, fit set,</text>
<text x="470" y="274" class="xs" text-anchor="middle">references</text>
<path d="M510 262 L520 262" class="arrow"/>
<rect x="520" y="230" width="80" height="64" class="green" rx="3"/>
<text x="560" y="248" class="xs" text-anchor="middle">stage 1:</text>
<text x="560" y="261" class="xs" text-anchor="middle">fit lines</text>
<text x="560" y="274" class="xs" text-anchor="middle">computed</text>
<path d="M600 262 L610 262" class="arrow"/>
<rect x="610" y="230" width="80" height="64" class="red" rx="3"/>
<text x="650" y="248" class="xs" text-anchor="middle">commit</text>
<text x="650" y="261" class="xs" text-anchor="middle">predictions</text>
<text x="650" y="274" class="xs" text-anchor="middle">(SHA-256)</text>
<path d="M690 262 L700 262" class="arrow"/>
<rect x="700" y="230" width="80" height="64" class="green" rx="3"/>
<text x="740" y="248" class="xs" text-anchor="middle">held-out</text>
<text x="740" y="261" class="xs" text-anchor="middle">agreement,</text>
<text x="740" y="274" class="xs" text-anchor="middle">still blinded</text>
<path d="M780 262 L790 262" class="arrow"/>
<rect x="790" y="230" width="80" height="64" class="green" rx="3"/>
<text x="830" y="248" class="xs" text-anchor="middle">stage 2:</text>
<text x="830" y="261" class="xs" text-anchor="middle">held-out</text>
<text x="830" y="274" class="xs" text-anchor="middle">unblinded</text>
<text x="430" y="316" class="xs" text-anchor="start">Held-out rows stay withheld, with no clock times, until the commitment is recorded.</text>
<text x="890" y="342" text-anchor="end" class="note">Schematic. No measured data; all values and widths illustrative, not to scale.</text>
</svg>
