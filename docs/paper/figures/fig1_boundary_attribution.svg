<text x="35" y="454" font-size="15">Solid line: recorded boundary 1.040 s → prefill 1.20 J; decode 1.80 J.</text>
<text x="35" y="479" font-size="15">Dashed line: moved boundary 1.050 s → prefill 1.50 J; decode 1.50 J.</text>
<text x="35" y="507" font-size="15">The request total remains 3.00 J. Blue hatching is the energy reassigned under held averages.</text>
