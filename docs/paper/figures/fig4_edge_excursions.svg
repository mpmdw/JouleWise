<text x="266.97" y="141.56" font-size="12.5" fill="#52514e">pulse 9, +27 ms — the edge that sets the published bound</text>
<circle cx="124.00" cy="564.00" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="138.00" y="568.00" font-size="13.5" fill="#0b0b0b">onset (switch-on edge) — 59 of 59 are late</text>
<rect x="514.00" y="559.50" width="9" height="9" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/>
<text x="532.00" y="568.00" font-size="13.5" fill="#0b0b0b">offset (switch-off edge) — 49 of 59 are early</text>
<text x="118.00" y="600.00" font-size="12.5" fill="#52514e">The dashed lines are each series' median — the part of the error that repeats from pulse to pulse rather than varying between them.</text>
<text x="118.00" y="619.00" font-size="12.5" fill="#52514e">The published bound is not read off this chart. It comes from the widest end of each edge's allowed interval: the full range of shifts the trace cannot rule out, which is</text>
<text x="118.00" y="638.00" font-size="12.5" fill="#52514e">wider than the best fit because each power record averages about a tenth of a second. That widest end is 28.93 ms, on pulse 9's onset;</text>
<text x="118.00" y="657.00" font-size="12.5" fill="#52514e">adding the 1.13 ms clock-anchor term gives the published B_fiducial = 30.07 ms. Values here are shown to two decimals; the data file carries them in full.</text>
<text x="118.00" y="676.00" font-size="12.5" fill="#52514e">Best-fit lags fall on a 0.5 ms grid because the fitting search steps in 0.5 ms increments. The allowed intervals are continuous.</text>
