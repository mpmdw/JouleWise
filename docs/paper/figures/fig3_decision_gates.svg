<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="fig3title fig3desc">
  <title id="fig3title">The two separate claim gates and the four possible outcomes</title>
  <desc id="fig3desc">Schematic decision flow. A measured contrast, carrying a point estimate and a composed uncertainty interval, meets two gates in turn. Gate one asks whether the magnitude exceeds the cell floor; failing it gives the outcome not resolvable. Gate two asks whether both intervals point the registered way and the Holm-adjusted test passes; failing it gives the outcome direction unresolved. Passing both gives a directional claim. A separate side inlet, taken when any admission or custody check fails, gives the outcome refused without reaching either gate. No measured data is shown.</desc>

  <defs>
    <marker id="f3aEnd" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="40" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b1b1b">Figure P1. Two separate gates, four possible outcomes</text>
  <text x="40" y="54" font-family="sans-serif" font-size="13" fill="#555555">Schematic diagram. No measured data is shown; no numeric threshold is implied by the layout.</text>

  <!-- refusal inlet row -->
  <rect x="40" y="100" width="410" height="80" fill="#ffffff" stroke="#777777" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="245" y="126" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">any admission or custody check fails</text>
  <text x="245" y="146" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">missing, stale, contaminated, duplicated, inconsistent,</text>
  <text x="245" y="164" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">or unauthenticated evidence</text>

  <line x1="450" y1="140" x2="718" y2="140" stroke="#333333" stroke-width="2" marker-end="url(#f3aEnd)"/>
  <text x="584" y="130" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">enters from the side; reaches no gate</text>

  <rect x="720" y="100" width="240" height="80" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.5"/>
  <text x="840" y="130" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="middle">refused</text>
  <text x="840" y="152" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">this evidence produces</text>
  <text x="840" y="170" font-family="sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">no authorized comparison result</text>

  <!-- separator -->
  <line x1="40" y1="205" x2="960" y2="205" stroke="#e2e2e2" stroke-width="1.5"/>

  <!-- input -->
  <rect x="30" y="240" width="180" height="100" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <text x="120" y="268" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="middle">measured contrast</text>
  <text x="120" y="290" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">point estimate plus</text>
  <text x="120" y="308" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">composed uncertainty</text>
  <text x="120" y="326" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">interval</text>

  <line x1="210" y1="290" x2="248" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#f3aEnd)"/>

  <!-- gate 1 -->
  <rect x="250" y="235" width="200" height="110" rx="6" fill="#ffffff" stroke="#444444" stroke-width="2.5"/>
  <text x="350" y="262" font-family="sans-serif" font-size="12" font-weight="bold" fill="#777777" text-anchor="middle" letter-spacing="1.2">Gate 1</text>
  <text x="350" y="284" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">does the estimate</text>
  <text x="350" y="302" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">magnitude exceed the cell&#8217;s</text>
  <text x="350" y="320" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">cell floor?</text>

  <line x1="450" y1="290" x2="488" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#f3aEnd)"/>
  <text x="469" y="280" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">yes</text>

  <!-- gate 2 -->
  <rect x="490" y="235" width="200" height="110" rx="6" fill="#ffffff" stroke="#444444" stroke-width="2.5"/>
  <text x="590" y="262" font-family="sans-serif" font-size="12" font-weight="bold" fill="#777777" text-anchor="middle" letter-spacing="1.2">Gate 2</text>
  <text x="590" y="290" font-family="sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle">do both intervals point the</text>
  <text x="590" y="310" font-family="sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle">registered way AND Holm pass?</text>

  <line x1="690" y1="290" x2="728" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#f3aEnd)"/>
  <text x="709" y="280" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">yes</text>

  <!-- directional claim -->
  <rect x="730" y="245" width="230" height="90" fill="#1b6ca8" fill-opacity="0.12" stroke="#1b6ca8" stroke-width="2.8"/>
  <text x="845" y="275" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="middle">directional claim</text>
  <text x="845" y="297" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">both gates pass, in the direction</text>
  <text x="845" y="315" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">registered before collection</text>

  <!-- gate 1 no -->
  <line x1="350" y1="345" x2="350" y2="438" stroke="#333333" stroke-width="2" marker-end="url(#f3aEnd)"/>
  <text x="362" y="396" font-family="sans-serif" font-size="12" fill="#333333">no</text>

  <rect x="240" y="440" width="220" height="100" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="350" y="468" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">not resolvable</text>
  <text x="350" y="490" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">smaller than this instrument</text>
  <text x="350" y="508" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">can resolve &#8212; not zero,</text>
  <text x="350" y="526" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">equality, or no difference</text>

  <!-- gate 2 no -->
  <line x1="590" y1="345" x2="590" y2="438" stroke="#333333" stroke-width="2" marker-end="url(#f3aEnd)"/>
  <text x="602" y="396" font-family="sans-serif" font-size="12" fill="#333333">no</text>

  <rect x="480" y="440" width="220" height="100" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="590" y="468" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="middle">direction unresolved</text>
  <text x="590" y="490" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">the floor clears, but the</text>
  <text x="590" y="508" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">interval or Holm does not pass,</text>
  <text x="590" y="526" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="middle">so no claim is made</text>

  <!-- side annotation -->
  <g font-family="sans-serif" font-size="12.5" fill="#333333">
    <text x="40" y="572">The cell floor is the registered operational resolution guard for assigned-energy differences.</text>
    <text x="40" y="592">The floor and interval remain separate gates. F+B is floor plus deterministic widening: a non-gating planning diagnostic,</text>
    <text x="40" y="612">neither necessary nor sufficient for acceptance; the uncertainty interval is never compared with that sum.</text>
  </g>
</svg>
